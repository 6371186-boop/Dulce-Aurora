<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/images/logo.png"><title>Factura electrónica (simulada)</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>body{background:#eceae4;font-family:Inter,Arial,sans-serif;color:#222}.sheet{max-width:820px;margin:auto;background:#fff;padding:2rem;position:relative;overflow:hidden;box-shadow:0 6px 30px #0002}
.wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:5.5rem;font-weight:800;color:#c0392b14;transform:rotate(-28deg);pointer-events:none;text-align:center;line-height:1}
.bx{border:1px solid #bbb;border-radius:6px;padding:.6rem .8rem;font-size:.78rem}.bx h4{font-weight:700;font-size:.72rem;letter-spacing:.06em;color:#1f4d3a;margin-bottom:.3rem;text-transform:uppercase}
table.it{width:100%;border-collapse:collapse;font-size:.75rem}.it th{background:#1f4d3a;color:#fff;padding:.4rem;text-align:left;font-weight:600}.it td{padding:.4rem;border-bottom:1px solid #e5e5e5}.r{text-align:right}
@media print{body{background:#fff}.sheet{box-shadow:none;padding:0;max-width:none}.np{display:none}@page{margin:12mm}}</style></head>
<body class="p-3 md:p-6"><div id="f" class="sheet">Cargando…</div>
<div class="np text-center mt-5 space-x-2"><button onclick="print()" class="bg-[#1f4d3a] text-white rounded-full px-6 py-2">🖨 Imprimir</button><button onclick="print()" class="bg-stone-700 text-white rounded-full px-6 py-2">⬇ Guardar como PDF</button></div>
<script>
const e=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),p=new URLSearchParams(location.search),$=n=>'$'+(+n).toFixed(2);
function letras(n){const u=['','UN','DOS','TRES','CUATRO','CINCO','SEIS','SIETE','OCHO','NUEVE','DIEZ','ONCE','DOCE','TRECE','CATORCE','QUINCE','DIECISÉIS','DIECISIETE','DIECIOCHO','DIECINUEVE','VEINTE','VEINTIUNO','VEINTIDÓS','VEINTITRÉS','VEINTICUATRO','VEINTICINCO','VEINTISÉIS','VEINTISIETE','VEINTIOCHO','VEINTINUEVE'],d=['','','','TREINTA','CUARENTA','CINCUENTA','SESENTA','SETENTA','OCHENTA','NOVENTA'],c=['','CIENTO','DOSCIENTOS','TRESCIENTOS','CUATROCIENTOS','QUINIENTOS','SEISCIENTOS','SETECIENTOS','OCHOCIENTOS','NOVECIENTOS'];
 const b=x=>{if(!x)return'';if(x==100)return'CIEN';let s=c[Math.floor(x/100)];const r=x%100;if(r){if(s)s+=' ';s+=r<30?u[r]:d[Math.floor(r/10)]+(r%10?' Y '+u[r%10]:'')}return s};
 const t=Math.round(n*100),ent=Math.floor(t/100),cts=t%100,mi=Math.floor(ent/1000),rs=ent%1000;let s='';
 if(mi)s=mi==1?'MIL':b(mi).replace(/VEINTIUNO$/,'VEINTIÚN')+' MIL';if(rs)s+=(s?' ':'')+b(rs);if(!s)s='CERO';return s+' '+String(cts).padStart(2,'0')+'/100 DÓLARES'}
fetch(`/api/factura/${encodeURIComponent(p.get('id'))}?tel=${encodeURIComponent(p.get('tel')||'')}`).then(r=>r.json().then(d=>{if(!r.ok)throw Error(d.error);return d})).then(d=>{
 const total=+d.total,neto=total/1.13,iva=total-neto,em=d.emisor,fh=new Date(d.creado),sello='SIMULADO-'+d.codigo_generacion.replace(/-/g,'').slice(0,20).toUpperCase();
 document.getElementById('f').innerHTML=`<div class="wm">SIMULADA<br>SIN VALIDEZ FISCAL</div>
 <div class="flex justify-between items-start gap-4 mb-3"><div class="flex items-center gap-3"><img src="/images/logo.png" class="h-20" alt="Dulce Aurora"><div class="text-xs"><b class="text-base">${e(em.nombre)}</b><br>${e(em.direccion)}<br>Tel. ${e(em.telefono)} · ${e(em.correo)}</div></div><div class="text-right"><p class="text-[11px] tracking-widest text-stone-500">DOCUMENTO TRIBUTARIO ELECTRÓNICO</p><p class="font-bold text-lg text-[#1f4d3a]">FACTURA (CONSUMIDOR FINAL)</p><p class="text-xs">Tipo de DTE: <b>${e(d.tipo_dte)}</b></p></div></div>
 <div class="text-center text-xs font-bold text-white bg-[#c0392b] rounded py-1 mb-3">FACTURA SIMULADA PARA FINES ACADÉMICOS · NO ES UN COMPROBANTE FISCAL AUTORIZADO</div>
 <div class="grid md:grid-cols-2 gap-2 mb-2"><div class="bx"><h4>Datos del documento</h4><p><b>Código de generación:</b><br><span class="break-all">${e(d.codigo_generacion).toUpperCase()}</span></p><p class="mt-1"><b>Número de control:</b><br><span class="break-all">${e(d.numero_control)}</span></p><p class="mt-1"><b>Sello de recepción:</b><br><span class="break-all">${e(sello)}</span> <i>(no emitido por Hacienda)</i></p></div>
 <div class="bx"><h4>Información de emisión</h4><p><b>Fecha y hora de generación:</b> ${fh.toLocaleDateString('es-SV')} ${fh.toLocaleTimeString('es-SV')}</p><p><b>Correlativo de factura:</b> ${e(d.numero)}</p><p><b>Modelo de facturación:</b> Previo</p><p><b>Tipo de transmisión:</b> Normal</p><p><b>Tipo de establecimiento:</b> Casa matriz</p><p><b>Moneda:</b> USD</p></div></div>
 <div class="grid md:grid-cols-2 gap-2 mb-3"><div class="bx"><h4>Emisor</h4><p><b>Nombre:</b> ${e(em.nombre)}</p><p><b>NIT:</b> ${e(em.nit)} · <b>NRC:</b> ${e(em.nrc)}</p><p><b>Actividad económica:</b> ${e(em.actividad)}</p><p><b>Dirección:</b> ${e(em.direccion)}</p></div>
 <div class="bx"><h4>Receptor</h4><p><b>Nombre:</b> ${e(d.nombre)}</p><p><b>Documento:</b> Consumidor final</p><p><b>Teléfono:</b> ${e(d.telefono)}</p><p><b>Dirección:</b> ${e(d.direccion)||'—'}</p></div></div>
 <table class="it"><tr><th>N°<th>Cant.<th>Unidad<th>Descripción<th class="r">Precio unit.<th class="r">Desc.<th class="r">V. no sujetas<th class="r">V. exentas<th class="r">V. gravadas</tr>
 ${d.items.map((i,k)=>`<tr><td>${k+1}<td>${i.cantidad}<td>Unidad<td>${e(i.nombre)}<td class="r">${$(i.precio_unitario)}<td class="r">$0.00<td class="r">$0.00<td class="r">$0.00<td class="r">${$(i.cantidad*i.precio_unitario)}</tr>`).join('')}</table>
 <div class="grid md:grid-cols-2 gap-3 mt-3"><div class="space-y-2"><div class="bx"><h4>Total en letras</h4><p class="font-semibold">${letras(total)}</p></div><div class="bx"><h4>Condición y pago</h4><p><b>Condición de la operación:</b> ${d.metodo==='Efectivo'?'Contra entrega':'Contado'}</p><p><b>Forma de pago:</b> ${e(d.metodo)}</p><p><b>Estado del pago:</b> ${e(d.pago)}</p>${d.referencia?`<p><b>Referencia (simulada):</b> ${e(d.referencia)}</p>`:''}</div><div class="flex items-center gap-3"><div id="qr"></div><p class="text-[10px] text-stone-500">Código QR de consulta interna del sistema.<br>No corresponde a una consulta pública de Hacienda.</p></div></div>
 <div class="bx text-sm"><h4>Resumen</h4><table class="w-full"><tr><td>Suma de ventas gravadas (IVA incluido)<td class="r">${$(total)}</tr><tr><td>Venta neta (sin IVA)<td class="r">${$(neto)}</tr><tr><td>IVA 13% (incluido en el precio)<td class="r">${$(iva)}</tr><tr><td>Descuentos / ventas exentas / no sujetas<td class="r">$0.00</tr><tr class="font-bold text-base border-t"><td class="pt-2">TOTAL A PAGAR<td class="r pt-2">${$(total)}</tr></table></div></div>
 <p class="mt-4 text-[11px] text-stone-600 border-t pt-2"><b>Aclaración:</b> esta factura es una representación <b>simulada</b> con el formato de la Factura Electrónica (DTE-01) de El Salvador, elaborada únicamente con fines académicos. No ha sido firmada, no fue transmitida al Ministerio de Hacienda, no posee sello de recepción real y <b>no constituye un comprobante fiscal autorizado</b>. Los datos fiscales del emisor son ficticios.</p>`;
 new QRCode(document.getElementById('qr'),{text:location.origin+'/factura.html?id='+d.pedido+'  COD:'+d.codigo_generacion,width:92,height:92});
}).catch(x=>document.getElementById('f').textContent=x.message);
</script></body></html>
