<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Factura</title><script src="https://cdn.tailwindcss.com"></script><style>@media print{.np{display:none}}</style></head>
<body class="bg-stone-100 p-4 font-sans"><div id=f class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow">Cargando…</div>
<div class="np text-center mt-4 space-x-2"><button onclick="print()" class="bg-pink-400 text-white rounded-full px-5 py-2">Imprimir</button><button onclick="print()" class="bg-stone-700 text-white rounded-full px-5 py-2">Guardar como PDF</button></div>
<script>
const e=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),p=new URLSearchParams(location.search);
fetch(`/api/factura/${encodeURIComponent(p.get('id'))}?tel=${encodeURIComponent(p.get('tel')||'')}`).then(r=>r.json().then(d=>{if(!r.ok)throw Error(d.error);return d})).then(d=>{
document.getElementById('f').innerHTML=`<div class="flex justify-between"><div><h1 class="text-2xl font-bold">🧁 Dulce Aurora</h1><p class="text-sm">Pastelería · Apopa</p></div><div class="text-right"><b>${e(d.numero)}</b><br>${new Date(d.creado).toLocaleString()}</div></div><hr class="my-4"><p><b>Cliente:</b> ${e(d.nombre)} · ${e(d.telefono)}<br>${e(d.direccion)}</p>
<table class="w-full my-4 text-sm"><tr class="text-left border-b"><th>Producto<th>Cant.<th>P. unit.<th>Subtotal</tr>${d.items.map(i=>`<tr><td>${e(i.nombre)}<td>${i.cantidad}<td>$${(+i.precio_unitario).toFixed(2)}<td>$${(i.cantidad*i.precio_unitario).toFixed(2)}</tr>`).join('')}</table>
<p class="text-right">Subtotal: $${(+d.total).toFixed(2)}</p><p class="text-right text-xl font-bold">Total: $${(+d.total).toFixed(2)}</p><p class="mt-2">Pago: ${e(d.metodo)} · <b>${e(d.pago)}</b></p>
<p class="mt-6 text-xs text-stone-500">Factura simulada para fines académicos. No constituye un comprobante fiscal autorizado.</p>`}).catch(x=>document.getElementById('f').textContent=x.message);
</script></body></html>
